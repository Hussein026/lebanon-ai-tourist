services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      OLLAMA_URL: http://host.docker.internal:11434/api/chat
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    ports:
      - "8001:8001"
    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput
        python manage.py shell -c "from hotels.models import Hotel; raise SystemExit(0 if Hotel.objects.exists() else 1)" || python manage.py loaddata core/fixtures/listings_snapshot.json
        python manage.py runserver 0.0.0.0:8001

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data: